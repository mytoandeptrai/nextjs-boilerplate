services:
  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the bundle at build time.
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://your-app.com}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    build: ./docker/nginx
    ports:
      - '8080:8080'
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
